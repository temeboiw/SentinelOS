name: SentinelOS installer validation

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-validation.yml"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check installer shell syntax
        run: |
          bash -n installer/build-installer.sh
          bash -n installer/make-iso.sh
          bash -n installer/check-iso.sh
          bash -n installer/test-official.sh
      - name: Run SPF package validation tests
        run: python3 -m unittest discover -s installer/tests -v
      - name: Install native installer build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld nasm qemu-utils qemu-system-x86 ovmf dosfstools mtools e2fsprogs fdisk xorriso
      - name: Fetch EDK2 headers
        run: git clone --depth 1 https://github.com/tianocore/edk2.git "$RUNNER_TEMP/edk2"
      - name: Build native installer and ISO
        env:
          EDK2: ${{ runner.temp }}/edk2
        run: |
          EDK2="$RUNNER_TEMP/edk2" bash installer/build-installer.sh
          bash installer/make-iso.sh
          bash installer/check-iso.sh
