name: SentinelOS build
on:
  push:
    branches:
      - gpu-bootvid-initialization
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-utils dosfstools e2fsprogs mtools gnu-efi
      - name: Build SentinelOS
        run: JOBS=2 ./scripts/build.sh
