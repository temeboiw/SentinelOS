name: SentinelOS build
on:
  push:
    branches:
      - gpu-bootvid-initialization
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-utils dosfstools e2fsprogs mtools
      - name: Fetch EDK2 headers
        run: git clone --depth 1 https://github.com/tianocore/edk2.git "$RUNNER_TEMP/edk2"
      - name: Build SentinelOS
        run: EDK2="$RUNNER_TEMP/edk2" JOBS=2 ./scripts/build.sh
