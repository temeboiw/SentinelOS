name: SentinelOS build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/msi-install-engine]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-utils qemu-system-x86 ovmf util-linux dosfstools e2fsprogs mtools gnu-efi
      - name: Test CAB/MSZIP decoder
        run: |
          mkdir -p build
          clang -std=c11 -Wall -Wextra tests/mszip_test.c -o build/mszip_test
          ./build/mszip_test
      - name: Fetch EDK2 headers
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git "$RUNNER_TEMP/edk2"
          echo "EDK2=$RUNNER_TEMP/edk2" >> "$GITHUB_ENV"
      - name: Build SentinelOS disk image
        run: bash scripts/build.sh
      - name: Boot smoke test
        shell: bash
        run: |
          mkdir -p build
          OVMF_CODE=""
          OVMF_VARS=""
          for pair in \
            "/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd" \
            "/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd" \
            "/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd" \
            "/usr/share/edk2-ovmf/x64/OVMF_CODE.fd|/usr/share/edk2-ovmf/x64/OVMF_VARS.fd"; do
            code="${pair%%|*}"
            vars="${pair#*|}"
            if [[ -f "$code" && -f "$vars" ]]; then OVMF_CODE="$code"; OVMF_VARS="$vars"; break; fi
          done
          if [[ -z "$OVMF_CODE" ]]; then echo "OVMF code/vars pair not found"; exit 1; fi
          cp "$OVMF_VARS" build/vars.fd
          set +e
          timeout 35s qemu-system-x86_64 \
            -machine q35 -m 1024 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/vars.fd \
            -drive file=build/magic-disk.img,format=raw,if=none,id=d0 \
            -device virtio-blk-pci,drive=d0 \
            -display none -serial file:build/serial.log -monitor none -no-reboot
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $rc"
            exit "$rc"
          fi
          grep -q "fs: C: volume root" build/serial.log
          grep -q -- "-- usermode (smss) --" build/serial.log
          echo "Boot smoke test passed: ext4 mounted and usermode entered."
